server.address=127.0.0.1
server.port=${PORT:8080}
spring.application.name=nivora-api
spring.profiles.default=local
server.error.include-message=never
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
nivora.cors.allowed-origin-patterns=${NIVORA_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173}
nivora.ai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
nivora.ai.api-key=${OPENAI_API_KEY:}
nivora.ai.model=${OPENAI_MODEL:gpt-4.1-mini}
