spring.datasource.url=jdbc:h2:mem:nivora;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
nivora.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*
nivora.ai.base-url=https://api.openai.com/v1
nivora.ai.api-key=test-api-key
nivora.ai.model=gpt-4.1-mini
